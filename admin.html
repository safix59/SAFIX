<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>SAFIX — Administration</title>
<style>
:root{
  --bg:#0a0c10; --bg2:#12161c; --card:#161b22; --bd:#232a33; --tx:#e9eef5; --mut:#8a97a8;
  --ac:#0a84ff; --ac2:#5ac8fa; --ok:#30d158; --warn:#ff9f0a; --dang:#ff453a;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:linear-gradient(180deg,#0a0c10,#0d1117);color:var(--tx);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--ac)}
.hidden{display:none!important}

/* ── LOGIN ── */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--bd);border-radius:20px;
  padding:34px 28px;box-shadow:0 30px 80px rgba(0,0,0,.5);text-align:center}
.logo{font-size:30px;font-weight:800;letter-spacing:-1.5px;margin-bottom:4px}
.logo span{color:var(--ac)}
.login-sub{color:var(--mut);font-size:13px;margin-bottom:26px}
.field{position:relative;margin-bottom:14px}
input[type=password]{width:100%;background:var(--bg2);border:1px solid var(--bd);border-radius:12px;
  color:var(--tx);font-size:16px;padding:14px 16px;outline:none}
input[type=password]:focus{border-color:var(--ac)}
.btn{width:100%;background:var(--ac);color:#fff;border:0;border-radius:12px;font-size:16px;font-weight:600;
  padding:14px;cursor:pointer;transition:filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.6;cursor:default}
.err{color:var(--dang);font-size:13px;min-height:18px;margin-top:6px}

/* ── APP ── */
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:14px;padding:14px 20px;
  background:rgba(13,17,23,.85);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
.top .logo{font-size:20px;margin:0}
.top .sp{flex:1}
.pill{font-size:12px;color:var(--mut);border:1px solid var(--bd);border-radius:999px;padding:5px 11px;cursor:pointer;background:none}
.pill:hover{border-color:var(--ac);color:var(--tx)}
.wrap{max-width:1150px;margin:0 auto;padding:22px 20px 60px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:30px 0 12px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px 18px}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.5px}
.kpi .l{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.kpi .v.ac{color:var(--ac2)}
.cards{display:grid;grid-template-columns:1fr;gap:10px}
.appt{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 16px}
.appt .dt{font-weight:700;min-width:150px}
.appt .slot{color:var(--ac2);font-size:13px}
.appt .who{color:var(--mut);font-size:13px;margin-left:auto;text-align:right}
.tbl-wrap{background:var(--card);border:1px solid var(--bd);border-radius:16px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:820px}
th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--bd);vertical-align:top}
th{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.05em;background:#10151b;position:sticky;top:0}
tr:last-child td{border-bottom:0}
.tot{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px}
.b-paid{background:rgba(48,209,88,.15);color:var(--ok)}
.b-ordered{background:rgba(10,132,255,.15);color:var(--ac2)}
.b-err{background:rgba(255,69,58,.15);color:var(--dang)}
.b-other{background:rgba(138,151,168,.15);color:var(--mut)}
.items{color:var(--mut);font-size:12.5px}
.muted{color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:40px 20px;background:var(--card);border:1px dashed var(--bd);border-radius:16px}
.soon{display:inline-block;font-size:11px;color:var(--warn);border:1px solid rgba(255,159,10,.4);border-radius:999px;padding:2px 9px;margin-left:8px}
@media(max-width:720px){.kpis{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<!-- ═══ LOGIN ═══ -->
<div class="login-wrap" id="loginView">
  <form class="login-card" id="loginForm" autocomplete="off">
    <div class="logo"><span>SA</span>FIX</div>
    <div class="login-sub">Espace administrateur</div>
    <div class="field">
      <input type="password" id="pw" placeholder="Mot de passe" autocomplete="current-password" required>
    </div>
    <button class="btn" id="loginBtn" type="submit">Se connecter</button>
    <div class="err" id="loginErr"></div>
  </form>
</div>

<!-- ═══ APP ═══ -->
<div id="appView" class="hidden">
  <div class="top">
    <div class="logo"><span>SA</span>FIX</div>
    <span class="pill" id="refreshBtn">↻ Rafraîchir</span>
    <span class="sp"></span>
    <span class="muted" id="clock" style="font-size:12px"></span>
    <span class="pill" id="logoutBtn">Déconnexion</span>
  </div>

  <div class="wrap">
    <div class="kpis" id="kpis"></div>

    <h2>📅 Prochains rendez-vous</h2>
    <div class="cards" id="appts"></div>

    <h2>📦 Dernières commandes</h2>
    <div id="ordersHost"></div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const euro = c => (Number(c||0)/100).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' €';
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const SLOTS = { morning:'Matin (9h–12h)', afternoon:'Après-midi (14h–18h)', evening:'Soir (18h–20h)' };
const fmtDate = s => { try { return new Date(s).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'}); } catch { return s; } };
const fmtDT = s => { try { return new Date(s).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); } catch { return s; } };

async function tryLoad() {
  const r = await fetch('/api/admin-data', { credentials:'same-origin' });
  if (r.status === 401) { showLogin(); return; }
  const d = await r.json();
  showApp(d);
}
function showLogin(){ $('#appView').classList.add('hidden'); $('#loginView').classList.remove('hidden'); setTimeout(()=>$('#pw')?.focus(),50); }
function showApp(d){
  $('#loginView').classList.add('hidden'); $('#appView').classList.remove('hidden');
  render(d);
}

$('#loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('#loginBtn'); const err = $('#loginErr');
  err.textContent=''; btn.disabled=true; btn.textContent='Connexion…';
  try {
    const r = await fetch('/api/admin-login', {
      method:'POST', headers:{'Content-Type':'application/json'}, credentials:'same-origin',
      body: JSON.stringify({ password: $('#pw').value })
    });
    if (r.ok) { $('#pw').value=''; await tryLoad(); }
    else { err.textContent = 'Mot de passe incorrect'; }
  } catch { err.textContent = 'Erreur réseau'; }
  btn.disabled=false; btn.textContent='Se connecter';
});

$('#logoutBtn').addEventListener('click', async () => {
  await fetch('/api/admin-logout', { method:'POST', credentials:'same-origin' });
  showLogin();
});
$('#refreshBtn').addEventListener('click', tryLoad);

function statusBadge(s){
  const map = { paid:['Payé','b-paid'], ordered:['Commandé','b-ordered'], error:['Erreur','b-err'] };
  const [txt,cls] = map[s] || [s||'—','b-other'];
  return `<span class="badge ${cls}">${esc(txt)}</span>`;
}
function itemsText(li){
  if (!Array.isArray(li)) return '';
  return li.map(it => esc((it.name || (it.repair_id||'') ) ) + (it.qty>1?(' ×'+it.qty):'')).join(', ');
}

function render(d){
  const st = d.stats || {};
  const orders = d.orders || [];
  // KPIs
  $('#kpis').innerHTML = [
    ['v',      st.total_orders ?? orders.length, 'Commandes (total)'],
    ['v ac',   euro(st.revenue_cents), 'Chiffre d\'affaires'],
    ['v',      st.orders_30d ?? '—', 'Commandes (30 j)'],
    ['v ac',   euro(st.revenue_30d_cents), 'CA 30 jours'],
  ].map(([c,v,l]) => `<div class="kpi"><div class="${c}">${v}</div><div class="l">${l}</div></div>`).join('');

  // Rendez-vous
  const ap = (st.upcoming_appointments || []);
  $('#appts').innerHTML = ap.length ? ap.map(a => {
    const soon = (new Date(a.date) - new Date()) < 3*864e5 ? '<span class="soon">bientôt</span>' : '';
    const lieu = a.addr === 'other' ? '🏠 domicile' : '📍 dépôt';
    return `<div class="appt">
      <div class="dt">${fmtDate(a.date)} ${soon}</div>
      <div class="slot">${esc(SLOTS[a.slot]||a.slot||'')} · ${lieu}</div>
      <div class="who">${esc(a.model||'')}<br>${esc(a.email||'')}</div>
    </div>`;
  }).join('') : '<div class="empty">Aucun rendez-vous à venir.</div>';

  // Commandes
  if (!orders.length) {
    $('#ordersHost').innerHTML = '<div class="empty">Aucune commande pour le moment.<br><span style="font-size:12.5px">Les commandes payées apparaîtront ici automatiquement.</span></div>';
    return;
  }
  const rows = orders.map(o => {
    const m = o.metadata || {};
    const appt = m.apptDate ? (fmtDate(m.apptDate) + (m.apptSlot?(' · '+(SLOTS[m.apptSlot]||m.apptSlot)):'')) : '—';
    const deliv = m.delivery === 'express' ? 'Express' : m.delivery === 'standard' ? 'Standard' : '—';
    return `<tr>
      <td class="muted" style="white-space:nowrap">${fmtDT(o.created_at)}</td>
      <td>${esc(o.customer_email||'—')}${m.phone?('<br><span class="muted">'+esc(m.phone)+'</span>'):''}${m.snap?('<br><span class="muted">👻 '+esc(m.snap)+'</span>'):''}</td>
      <td>${esc(m.model||'—')}<div class="items">${itemsText(o.line_items)}</div></td>
      <td>${esc(deliv)}</td>
      <td>${esc(appt)}</td>
      <td class="tot">${euro(o.total_cents)}</td>
      <td>${statusBadge(o.status)}</td>
    </tr>`;
  }).join('');
  $('#ordersHost').innerHTML = `<div class="tbl-wrap"><table>
    <thead><tr><th>Date</th><th>Client</th><th>Modèle / Articles</th><th>Livraison</th><th>Rendez-vous</th><th>Total</th><th>Statut</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

function tick(){ const c=$('#clock'); if(c) c.textContent = new Date().toLocaleString('fr-FR',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); }
setInterval(tick, 1000); tick();

// Démarrage : tente de charger (cookie de session déjà là ?) sinon login.
tryLoad();
</script>
</body>
</html>
