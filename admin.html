<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<title>SAFIX · Admin</title>
<style>
:root{
  --bg:#000; --bg2:#0a0a0a; --panel:#0d0d0f; --panel2:#141416;
  --surface:rgba(255,255,255,.05); --surface2:rgba(255,255,255,.08);
  --border:rgba(255,255,255,.08); --border2:rgba(255,255,255,.14);
  --text:#fff; --text2:rgba(235,235,245,.74); --text3:rgba(235,235,245,.5);
  --accent:#007AFF; --accent2:#0A84FF; --accent-rgb:0,122,255;
  --ok:#30d158; --warn:#ff9f0a; --dang:#ff453a;
  --r:14px; --r2:18px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.hidden{display:none!important}
button{font-family:inherit}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--surface2);border-radius:9px}

/* ─── LOGIN ─── */
.login{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(1200px 600px at 50% -10%,rgba(var(--accent-rgb),.12),transparent 60%)}
.login-card{width:100%;max-width:360px;text-align:center}
.brand-lg{font-size:34px;font-weight:800;letter-spacing:-1.8px}
.brand-lg b{color:var(--accent);font-weight:800}
.login-sub{color:var(--text3);font-size:13.5px;margin:6px 0 30px;letter-spacing:.2px}
.login input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:12px;color:var(--text);font-size:16px;padding:15px 16px;outline:none;transition:border-color .15s,background .15s}
.login input:focus{border-color:var(--accent);background:var(--surface2)}
.login .btn{width:100%;margin-top:12px;background:var(--accent);color:#fff;border:0;border-radius:12px;font-size:16px;font-weight:600;padding:15px;cursor:pointer;transition:filter .15s}
.login .btn:hover{filter:brightness(1.1)}.login .btn:disabled{opacity:.55}
.err{color:var(--dang);font-size:13px;min-height:18px;margin-top:10px}

/* ─── SHELL ─── */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100dvh}
.sidebar{position:sticky;top:0;height:100dvh;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:20px 14px;z-index:40}
.side-brand{display:flex;align-items:center;gap:9px;padding:6px 10px 20px;font-size:19px;font-weight:800;letter-spacing:-.8px}
.side-brand b{color:var(--accent)}
.side-brand .tag{margin-left:auto;font-size:10px;font-weight:600;color:var(--text3);letter-spacing:.14em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px;flex:1}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;color:var(--text2);font-size:14.5px;font-weight:500;cursor:pointer;text-decoration:none;transition:background .13s,color .13s;border:1px solid transparent}
.nav a:hover{background:var(--surface);color:var(--text)}
.nav a.on{background:var(--surface2);color:var(--text);border-color:var(--border)}
.nav a svg{width:18px;height:18px;flex:none;opacity:.9}
.nav a .cnt{margin-left:auto;font-size:11px;font-weight:700;color:#fff;background:var(--dang);border-radius:999px;padding:1px 7px;min-width:20px;text-align:center}
.side-foot{border-top:1px solid var(--border);padding-top:14px;margin-top:8px;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--text3)}
.side-foot .logout{margin-left:auto;color:var(--text2);cursor:pointer;border:1px solid var(--border);border-radius:9px;padding:6px 11px;background:none;font-size:12.5px}
.side-foot .logout:hover{border-color:var(--border2);color:var(--text)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.ok{background:var(--ok);box-shadow:0 0 0 3px rgba(48,209,88,.18)}.dot.warn{background:var(--warn);box-shadow:0 0 0 3px rgba(255,159,10,.18)}.dot.dang{background:var(--dang);box-shadow:0 0 0 3px rgba(255,69,58,.18)}
.live{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text2);background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:6px 12px;font-variant-numeric:tabular-nums}
.live b{color:var(--text);font-weight:700}
.live .pulse{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 1.8s infinite}
.live.off{color:var(--text3)}.live.off .pulse{background:var(--text3);animation:none;box-shadow:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(48,209,88,.5)}70%{box-shadow:0 0 0 8px rgba(48,209,88,0)}100%{box-shadow:0 0 0 0 rgba(48,209,88,0)}}
.toolbar{display:flex;gap:10px;margin-bottom:15px;flex-wrap:wrap}
.toolbar input{flex:1;min-width:180px;background:var(--surface);border:1px solid var(--border);border-radius:11px;color:var(--text);font-size:14.5px;padding:11px 14px;outline:none}
.toolbar input:focus{border-color:var(--accent)}
.toolbar .exp{background:var(--surface);border:1px solid var(--border);color:var(--text2);border-radius:11px;padding:11px 15px;font-size:13.5px;cursor:pointer;white-space:nowrap}
.toolbar .exp:hover{border-color:var(--border2);color:var(--text)}
.money-flow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:12px;align-items:stretch;margin-bottom:16px}
.money{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:20px 22px}
.money .ml{font-size:12.5px;color:var(--text3);font-weight:500}
.money .mv{font-size:29px;font-weight:750;letter-spacing:-1px;margin-top:9px;font-variant-numeric:tabular-nums;line-height:1.05}
.money .ms{font-size:12px;color:var(--text3);margin-top:5px}
.money.in .mv{color:var(--accent2)}.money.out .mv{color:var(--warn)}
.money.gain{border-color:rgba(48,209,88,.4);background:linear-gradient(180deg,rgba(48,209,88,.06),transparent)}
.money.gain .mv{color:var(--ok)}
.money-arrow{display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--text3);font-weight:300}
@media(max-width:820px){.money-flow{grid-template-columns:1fr}.money-arrow{padding:1px 0}}
.del{background:none;border:1px solid var(--border);color:var(--text3);border-radius:8px;padding:5px 9px;font-size:12px;cursor:pointer;transition:.13s}
.del:hover{border-color:var(--dang);color:var(--dang)}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:16px 26px;background:rgba(0,0,0,.72);backdrop-filter:blur(18px);border-bottom:1px solid var(--border)}
.menu-btn{display:none;background:var(--surface);border:1px solid var(--border);color:var(--text);width:38px;height:38px;border-radius:10px;font-size:17px;cursor:pointer}
.page-title{font-size:20px;font-weight:700;letter-spacing:-.4px}
.page-sub{color:var(--text3);font-size:12.5px;margin-top:1px}
.topbar .sp{flex:1}
.clock{color:var(--text3);font-size:12.5px;font-variant-numeric:tabular-nums}
.icon-btn{background:var(--surface);border:1px solid var(--border);color:var(--text2);width:38px;height:38px;border-radius:10px;font-size:16px;cursor:pointer;transition:.13s}
.icon-btn:hover{border-color:var(--border2);color:var(--text)}
.content{padding:24px 26px 80px;max-width:1160px;width:100%}

/* ─── COMPONENTS ─── */
.sect-title{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--text3);margin:30px 0 13px}
.sect-title:first-child{margin-top:0}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:18px 20px;transition:border-color .15s}
.kpi:hover{border-color:var(--border2)}
.kpi .l{font-size:12px;color:var(--text3);font-weight:500}
.kpi .v{font-size:27px;font-weight:750;letter-spacing:-.8px;margin-top:8px;font-variant-numeric:tabular-nums}
.kpi .v.ac{color:var(--accent2)}.kpi .v.ok{color:var(--ok)}.kpi .v.warn{color:var(--warn)}
.kpi .s{font-size:11.5px;color:var(--text3);margin-top:3px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden}
.panel-pad{padding:18px 20px}
.alert{display:flex;gap:11px;align-items:flex-start;border-radius:var(--r);padding:13px 15px;margin-bottom:9px;font-size:14px;border:1px solid}
.a-error{background:rgba(255,69,58,.08);border-color:rgba(255,69,58,.32);color:#ffd7d4}
.a-warn{background:rgba(255,159,10,.07);border-color:rgba(255,159,10,.3);color:#ffe6bf}
.a-ok{background:var(--surface);border-color:var(--border);color:var(--text2)}
.appt{display:flex;gap:14px;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);transition:background .12s}
.appt:hover{background:var(--surface)}
.appt:last-child{border-bottom:0}
.appt .dt{font-weight:650;min-width:145px;font-size:14px}
.appt .slot{color:var(--accent2);font-size:13px}
.appt .who{color:var(--text3);font-size:13px;margin-left:auto;text-align:right;line-height:1.4}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:600px}
th,td{padding:15px 20px;text-align:left;vertical-align:middle}
thead th{color:var(--text3);font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;background:var(--bg2);position:sticky;top:0;border-bottom:1px solid var(--border2)}
tbody td{border-bottom:1px solid var(--border)}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .12s}tbody tr:hover{background:var(--surface)}
tbody td:first-child{color:var(--text3);font-size:13px}
.tot{font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl-scroll{overflow:auto}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px}
.b-paid{background:rgba(48,209,88,.14);color:var(--ok)}.b-ordered{background:rgba(10,132,255,.16);color:var(--accent2)}
.b-err{background:rgba(255,69,58,.14);color:var(--dang)}.b-other{background:var(--surface2);color:var(--text3)}
.up{color:var(--dang);font-weight:600}.down{color:var(--ok);font-weight:600}
.chip{display:inline-block;font-size:11.5px;padding:3px 9px;border-radius:8px;background:var(--surface);border:1px solid var(--border);margin:2px 4px 2px 0;color:var(--text2)}
.muted{color:var(--text3)}.items{color:var(--text3);font-size:12px;margin-top:3px}
.empty{text-align:center;color:var(--text3);padding:46px 20px}
.empty .big{font-size:30px;margin-bottom:8px;opacity:.5}
.soon{font-size:10.5px;color:var(--warn);border:1px solid rgba(255,159,10,.4);border-radius:999px;padding:1px 8px;margin-left:7px;vertical-align:middle}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.bar-row{display:flex;align-items:center;gap:14px;margin:12px 0}
.bar-row .bl{width:150px;color:var(--text2);font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .bt{flex:1;background:var(--surface);border-radius:99px;overflow:hidden;height:6px}
.bar-row .bf{height:100%;background:var(--accent);border-radius:99px;min-width:3px}
.bar-row .bv{width:44px;text-align:right;font-variant-numeric:tabular-nums;font-size:13px;color:var(--text)}
pre.sql{margin:0;white-space:pre-wrap;font:12.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--accent2)}
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:35;backdrop-filter:blur(2px)}
@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;width:260px;transform:translateX(-100%);transition:transform .22s ease}
  .app.open .sidebar{transform:none}.app.open .scrim{display:block}
  .menu-btn{display:block}.content{padding:20px 16px 80px}.topbar{padding:14px 16px}
  .kpis{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login" id="loginView">
  <form class="login-card" id="loginForm" autocomplete="off">
    <div class="brand-lg"><b>SA</b>FIX</div>
    <div class="login-sub">ESPACE ADMINISTRATEUR</div>
    <input type="password" id="pw" placeholder="Mot de passe" autocomplete="current-password" required>
    <button class="btn" id="loginBtn" type="submit">Se connecter</button>
    <div class="err" id="loginErr"></div>
  </form>
</div>

<!-- APP -->
<div class="app hidden" id="appView">
  <aside class="sidebar">
    <div class="side-brand"><b>SA</b>FIX<span class="tag">Admin</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot"><span class="dot ok" id="hdot"></span><span id="hlabel">—</span><button class="logout" id="logoutBtn">Quitter</button></div>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn">☰</button>
      <div><div class="page-title" id="pageTitle">Vue d’ensemble</div><div class="page-sub" id="pageSub"></div></div>
      <div class="sp"></div>
      <span class="live off" id="liveBadge"><span class="pulse"></span><span id="liveTxt">—</span></span>
      <span class="clock" id="clock"></span>
      <button class="icon-btn" id="refreshBtn" title="Rafraîchir">↻</button>
    </header>
    <div class="content" id="view"></div>
  </div>
  <div class="scrim" id="scrim"></div>
</div>

<script>
const $=s=>document.querySelector(s);
const euro=c=>(Number(c||0)/100).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const SLOTS={morning:'Matin (9h–12h)',afternoon:'Après-midi (14h–18h)',evening:'Soir (18h–20h)'};
const SRC_LABEL={qr:'Scan QR',search:'Recherche',social:'Réseaux sociaux',direct:'Accès direct',referral:'Autre site',interne:'Navigation interne'};
const DEV_LABEL={'iPhone':'📱 iPhone','iPad':'📲 iPad','iPod':'📱 iPod','Mac':'💻 Mac','Android':'🤖 Android','Tablette Android':'🤖 Tablette Android','Windows':'🖥️ Windows','Windows Phone':'📱 Windows Phone','Chromebook':'💻 Chromebook','Linux':'🐧 Linux','Autre':'❔ Autre','mobile':'📱 Mobile','tablet':'📲 Tablette','desktop':'🖥️ Ordinateur'};
const ANDROID_MODELS={'SM-S911B':'Galaxy S23','SM-S916B':'Galaxy S23+','SM-S918B':'Galaxy S23 Ultra','SM-S921B':'Galaxy S24','SM-S926B':'Galaxy S24+','SM-S928B':'Galaxy S24 Ultra','SM-S931B':'Galaxy S25','SM-S936B':'Galaxy S25+','SM-S938B':'Galaxy S25 Ultra','SM-A546B':'Galaxy A54','SM-A356B':'Galaxy A35','SM-A155F':'Galaxy A15','SM-G991B':'Galaxy S21','SM-G998B':'Galaxy S21 Ultra','SM-F946B':'Galaxy Z Fold5','SM-F731B':'Galaxy Z Flip5'};
function modelName(code){if(!code)return '';return ANDROID_MODELS[code]||code;}
function deviceFull(device,model){const base=DEV_LABEL[device]||device||'';return model?(base+' · '+modelName(model)):base;}
const fDate=s=>{try{return new Date(s).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'})}catch{return s}};
const fDT=s=>{try{return new Date(s).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}catch{return s}};
let DATA=null, VISITS=null, TAB='home';

const IC={
  home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/>',
  orders:'<path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/>',
  finance:'<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/>',
  visitors:'<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><path d="M16 4.5a3 3 0 0 1 0 6"/><path d="M21 20c0-2.4-1.4-4.2-3.5-5"/>',
  catalog:'<path d="M20.6 13.4 12 22l-9-9V4h9l8.6 8.6a1.4 1.4 0 0 1 0 2z"/><circle cx="7.5" cy="7.5" r="1.3"/>',
  history:'<path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v4h4"/><path d="M12 8v4l3 2"/>',
  system:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 7 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0-1.1-2.7H1a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 2.6 7a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H7a1.6 1.6 0 0 0 1-1.5V1a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 2.7 1.1 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V7a1.6 1.6 0 0 0 1.5 1H23a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/>'
};
const NAV=[['home','Vue d’ensemble'],['orders','Commandes'],['finance','Finances'],['visitors','Visiteurs'],['catalog','Catalogue & Prix'],['history','Historique prix'],['system','Système & santé']];
const SUB={home:'Résumé de l’activité',orders:'Toutes les commandes reçues',finance:'Chiffre d’affaires, coûts et marge',visitors:'Fréquentation du site',catalog:'Disponibilité, liens et prix',history:'Évolution des prix Utopya',system:'État technique et alertes'};

async function api(action,opts){return fetch('/api/admin?action='+action,Object.assign({credentials:'same-origin'},opts||{}));}
async function tryLoad(){const r=await api('data');if(r.status===401){showLogin();return;}DATA=await r.json();showApp();}
function showLogin(){stopPolling&&stopPolling();$('#appView').classList.add('hidden');$('#loginView').classList.remove('hidden');setTimeout(()=>$('#pw')?.focus(),50);}
function showApp(){$('#loginView').classList.add('hidden');$('#appView').classList.remove('hidden');renderNav();renderHealth();render();startPolling();}

$('#loginForm').addEventListener('submit',async e=>{
  e.preventDefault();const b=$('#loginBtn'),er=$('#loginErr');er.textContent='';b.disabled=true;b.textContent='Connexion…';
  try{const r=await api('login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#pw').value})});
    if(r.ok){$('#pw').value='';await tryLoad();}else er.textContent='Mot de passe incorrect';}
  catch{er.textContent='Erreur réseau';}
  b.disabled=false;b.textContent='Se connecter';
});
$('#logoutBtn').addEventListener('click',async()=>{await api('logout',{method:'POST'});showLogin();});
$('#refreshBtn').addEventListener('click',()=>{VISITS=null;$('#refreshBtn').style.transform='rotate(360deg)';setTimeout(()=>$('#refreshBtn').style.transform='',400);tryLoad();});
$('#menuBtn').addEventListener('click',()=>$('#appView').classList.toggle('open'));
$('#scrim').addEventListener('click',()=>$('#appView').classList.remove('open'));

function renderNav(){
  const errs=(DATA?.health?.order_errors||[]).length;
  $('#nav').innerHTML=NAV.map(([k,l])=>{
    const badge=(k==='system'&&errs)?`<span class="cnt">${errs}</span>`:'';
    return `<a data-tab="${k}" class="${k===TAB?'on':''}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg>${l}${badge}</a>`;
  }).join('');
  $('#nav').querySelectorAll('a').forEach(a=>a.onclick=()=>{TAB=a.dataset.tab;$('#appView').classList.remove('open');renderNav();render();});
  $('#pageTitle').textContent=NAV.find(n=>n[0]===TAB)[1];
  $('#pageSub').textContent=SUB[TAB]||'';
}
function renderHealth(){const al=DATA?.health?.alerts||[];const lvl=al.some(a=>a.level==='error')?'dang':al.some(a=>a.level==='warn')?'warn':'ok';
  $('#hdot').className='dot '+lvl;$('#hlabel').textContent=lvl==='ok'?'Tout va bien':(al.length+' alerte'+(al.length>1?'s':''));}

function statusBadge(s){const m={paid:['Payé','b-paid'],ordered:['Commandé','b-ordered'],error:['Erreur','b-err']};const[t,c]=m[s]||[s||'—','b-other'];return `<span class="badge ${c}">${esc(t)}</span>`;}
function itemsText(li){if(!Array.isArray(li))return '';return li.map(it=>esc(it.name||it.repair_id||'')+(it.qty>1?(' ×'+it.qty):'')).join(', ');}
function alertsHtml(al){if(!al||!al.length)return `<div class="alert a-ok"><span>✓</span><span>Aucune alerte — tout fonctionne normalement.</span></div>`;
  return al.map(a=>`<div class="alert a-${a.level}"><span>${a.level==='error'?'⛔':'⚠️'}</span><span>${esc(a.msg)}</span></div>`).join('');}
function kpi(v,l,cls,s){return `<div class="kpi"><div class="l">${l}</div><div class="v ${cls||''}">${v}</div>${s?`<div class="s">${s}</div>`:''}</div>`;}
function emptyBox(icon,txt){return `<div class="panel"><div class="empty"><div class="big">${icon}</div>${txt}</div></div>`;}
function bars(items){const max=Math.max(1,...items.map(i=>i.v));return items.map(i=>`<div class="bar-row"><div class="bl">${esc(i.k)}</div><div class="bt"><div class="bf" style="width:${Math.round(i.v/max*100)}%"></div></div><div class="bv">${i.v}</div></div>`).join('');}
function hourChart(arr){const max=Math.max(1,...arr);return `<div style="display:flex;gap:3px;align-items:flex-end;height:110px">`+arr.map((n,h)=>`<div title="${h}h : ${n} visite(s)" style="flex:1;background:linear-gradient(180deg,var(--accent2),var(--accent));border-radius:4px 4px 0 0;height:${Math.max(3,Math.round(n/max*100))}px;opacity:${n?1:.18}"></div>`).join('')+`</div><div class="muted" style="font-size:10.5px;display:flex;justify-content:space-between;margin-top:6px"><span>0h</span><span>6h</span><span>12h</span><span>18h</span><span>23h</span></div>`;}

  const v=$('#view'),s=DATA.stats||{},cat=DATA.catalog||{},h=DATA.health||{},pc=DATA.price_changes||{};
  if(TAB==='home'){
    const ap=s.upcoming_appointments||[];

    const online=(LIVE&&LIVE.ready)?LIVE.online:null;
    const visToday=(VISITS&&VISITS.ready)?VISITS.today:null;
    v.innerHTML=`
      ${(h.alerts&&h.alerts.length)?`<div class="sect-title">À surveiller</div>${alertsHtml(h.alerts)}`:''}
      <div class="sect-title">En direct</div>
      <div class="kpis">
        ${kpi(online==null?'—':online,'En ligne maintenant',online?'ok':'',online?'personne(s) sur le site':'personne pour l’instant')}
        ${kpi(visToday==null?'—':visToday,'Visites aujourd’hui','ac')}
        ${kpi(s.total_orders??0,'Commandes','',(s.orders_30d??0)+' sur 30 jours')}
        ${kpi(euro(s.benefice_cents),'Bénéfice total','ok')}
      </div>
      <div class="sect-title">Prochains rendez-vous</div>
      ${ap.length?`<div class="panel">${ap.map(apptRow).join('')}</div>`:emptyBox('📅','Aucun rendez-vous à venir.')}
      <div class="sect-title">Dernières commandes</div>
      ${recent.length?`<div class="panel">${recent.map(x=>{const m=x.metadata||{};return `<div class="appt"><div class="dt" style="min-width:105px">${fDT(x.created_at)}</div><div style="flex:1;min-width:0">${esc(m.model||'—')}<div class="items">${itemsText(x.line_items)}</div></div><div class="tot" style="color:var(--accent2);margin:0 14px">${euro(x.total_cents)}</div>${statusBadge(x.status)}</div>`;}).join('')}</div>`:emptyBox('📦','Aucune commande pour le moment.')}`;
  }
  else if(TAB==='orders'){renderOrders();return;}
  else if(TAB==='finance'){
    v.innerHTML=`
      <div class="sect-title">Ton argent, en clair</div>
      <div class="money-flow">
        <div class="money in"><div class="ml">Tu encaisses</div><div class="mv">${euro(s.encaisse_cents)}</div><div class="ms">payé par les clients</div></div>
        <div class="money-arrow">−</div>
        <div class="money out"><div class="ml">Tu paies chez Utopya</div><div class="mv">${euro(s.cout_pieces_cents)}</div><div class="ms">coût des pièces à commander</div></div>
        <div class="money-arrow">=</div>
        <div class="money gain"><div class="ml">Il te reste (bénéfice)</div><div class="mv">${euro(s.benefice_cents)}</div><div class="ms">c’est ton gain, à toi</div></div>
      </div>
      <div class="alert a-ok"><span>💡</span><span>Chaque client te paie une pièce + ton travail. La part <b>pièce</b> repart chez Utopya, le reste est <b>ton bénéfice</b>. (Hors frais de livraison que tu factures et frais bancaires Stripe.)</span></div>
      ${s.cost_unknown_orders?`<div class="alert a-warn"><span>⚠️</span><span><b>${s.cost_unknown_orders} commande(s)</b> sans détail de pièces exploitable (ex. anciennes commandes de test) — leur coût n’est pas compté, marquées « à confirmer » ci-dessous.</span></div>`:''}
      <div class="sect-title">Sur les 30 derniers jours</div>
      <div class="kpis">
        ${kpi(euro(s.encaisse_30d_cents),'Encaissé','ac')}
        ${kpi(euro(s.cout_30d_cents),'Payé chez Utopya','warn')}
        ${kpi(euro(s.benefice_30d_cents),'Bénéfice','ok')}
        ${kpi(s.orders_30d??0,'Commandes')}
      </div>
      <div class="sect-title">Détail par commande</div>
      ${(DATA.orders||[]).length?financeTable(DATA.orders):emptyBox('💶','Aucune commande.')}`;
  }
  else if(TAB==='visitors'){renderVisitors();return;}
  else if(TAB==='catalog'){
    v.innerHTML=`
      <div class="sect-title">Santé du catalogue</div>
      <div class="kpis">
        ${kpi(cat.combos??0,'Fiches suivies')}
        ${kpi(cat.in_stock??0,'En stock','ok')}
        ${kpi(cat.out_of_stock??0,'En rupture','warn')}
        ${kpi(cat.broken??0,'Liens sans prix','warn')}
      </div>
      ${(cat.over_ceiling&&cat.over_ceiling.length)?`<div class="sect-title">Prix au-dessus du prix Apple</div><div class="panel tbl-scroll">${overCeilTable(cat.over_ceiling)}</div>`:''}
      ${(cat.broken_items&&cat.broken_items.length)?`<div class="sect-title">Liens à vérifier chez Utopya</div><div class="panel tbl-scroll">${brokenTable(cat.broken_items)}</div>`:''}
      <div class="sect-title">Réparations manquantes par modèle</div>${gapsHtml(cat.model_gaps)}

  }
  else if(TAB==='history'){
    const c=pc.counts_30d||{};
    v.innerHTML=`
      <div class="sect-title">Évolution (30 derniers jours)</div>
      <div class="kpis">
        ${kpi(c.up??0,'Hausses','warn')}
        ${kpi(c.down??0,'Baisses','ok')}
        ${kpi(c.oos??0,'Ruptures')}
        ${kpi(c.restock??0,'Retours en stock','ok')}
      </div>
      <div class="sect-title">Derniers changements${pc.updatedAt?` · maj ${fDT(pc.updatedAt)}`:''}</div>
      ${(pc.recent&&pc.recent.length)?`<div class="panel tbl-scroll">${historyTable(pc.recent)}</div>`:emptyBox('📈','L’historique se remplira aux prochains rafraîchissements.')}`;
  }
  else if(TAB==='system'){
    v.innerHTML=`
      <div class="sect-title">Alertes & pannes</div>${alertsHtml(h.alerts)}
      <div class="sect-title">Diagnostic</div>
      <div class="panel">
        ${diag('Base de données (Supabase)',h.supabase_ok)}
        ${diag('Prix à jour',h.prices_ok)}
        ${diag('Commandes en erreur',(h.order_errors||[]).length===0,(h.order_errors||[]).length+' en erreur')}
        ${diag('Payées non commandées',(h.paid_not_ordered||0)===0,(h.paid_not_ordered||0)+' en attente')}
      </div>
      ${cat.prices_generated_at?`<div class="alert a-ok" style="margin-top:14px"><span>🕒</span><span>Dernier rafraîchissement des prix : <b>${fDT(cat.prices_generated_at)}</b> (${cat.prices_age_hours!=null?Math.round(cat.prices_age_hours)+' h':'?'}).</span></div>`:''}
      ${(h.order_errors&&h.order_errors.length)?`<div class="sect-title">Commandes en erreur</div><div class="panel tbl-scroll">${errorsTable(h.order_errors)}</div>`:''}`;
  }
}
let ORDER_Q='';
function rawItems(li){if(!Array.isArray(li))return '';return li.map(it=>(it.name||it.repair_id||'')+(it.qty>1?(' x'+it.qty):'')).join(', ');}
function renderOrders(){
  const all=DATA.orders||[];const q=ORDER_Q.trim().toLowerCase();
  const o=q?all.filter(x=>{const m=x.metadata||{};return [x.customer_email,m.model,m.phone,m.snap,x.status,rawItems(x.line_items)].join(' ').toLowerCase().includes(q);}):all;
  $('#view').innerHTML=`
    <div class="toolbar">
      <input id="ordSearch" type="search" placeholder="Rechercher : email, modèle, téléphone, statut…" value="${esc(ORDER_Q)}">
      <button class="exp" id="ordExport">⬇︎ Exporter (CSV)</button>
    </div>
    <div class="sect-title">${o.length} commande${o.length>1?'s':''}${q?` sur ${all.length}`:''}</div>
    ${o.length?ordersTable(o):emptyBox('📦',q?('Aucun résultat pour « '+esc(ORDER_Q)+' ».'):'Aucune commande pour le moment.<br><span style="font-size:12.5px">Les commandes payées s’afficheront ici automatiquement.</span>')}`;
  const si=$('#ordSearch');
  if(si){si.oninput=()=>{const p=si.selectionStart;ORDER_Q=si.value;renderOrders();const s2=$('#ordSearch');if(s2){s2.focus();try{s2.setSelectionRange(p,p);}catch(e){}}};}
  $('#ordExport')?.addEventListener('click',exportCSV);
}
function exportCSV(){
  const o=DATA.orders||[];
  const head=['Date','Email','Téléphone','Snapchat','Modèle','Articles','Livraison','Date RDV','Créneau','Lieu','Total (€)','Statut'];
  const rows=o.map(x=>{const m=x.metadata||{};return [x.created_at||'',x.customer_email||'',m.phone||'',m.snap||'',m.model||'',rawItems(x.line_items),m.delivery||'',m.apptDate||'',m.apptSlot||'',m.addr==='other'?'domicile':'dépôt',(Number(x.total_cents||0)/100).toFixed(2),x.status||''];});
  const csv=[head,...rows].map(r=>r.map(c=>'"'+String(c==null?'':c).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='commandes-safix-'+new Date().toISOString().slice(0,10)+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
async function delOrder(id){
  if(!confirm('Supprimer définitivement cette commande ?\n(à utiliser pour retirer les commandes de test)'))return;
  try{const r=await api('order-del&id='+encodeURIComponent(id),{method:'POST'});if(!r.ok)alert('Suppression impossible.');}catch{alert('Erreur réseau.');}
  await tryLoad();
}
function apptRow(a){const soon=(new Date(a.date)-new Date())<3*864e5?'<span class="soon">bientôt</span>':'';const lieu=a.addr==='other'?'🏠 domicile':'📍 dépôt';
  return `<div class="appt"><div class="dt">${fDate(a.date)}${soon}</div><div class="slot">${esc(SLOTS[a.slot]||a.slot||'')} · ${lieu}</div><div class="who">${esc(a.model||'')}<br>${esc(a.email||'')}</div></div>`;}
function ordersTable(o){return `<div class="panel tbl-scroll"><table><thead><tr><th>Date</th><th>Client</th><th>Modèle / Articles</th><th>Livr.</th><th>Rendez-vous</th><th>Total</th><th>Statut</th><th></th></tr></thead><tbody>`+
  o.map(x=>{const m=x.metadata||{};const appt=m.apptDate?fDate(m.apptDate)+(m.apptSlot?(' · '+(SLOTS[m.apptSlot]||m.apptSlot)):''):'—';const dl=m.delivery==='express'?'Express':m.delivery==='standard'?'Standard':'—';
  return `<tr><td class="muted" style="white-space:nowrap">${fDT(x.created_at)}</td><td>${esc(x.customer_email||'—')}${m.phone?'<br><span class="muted">'+esc(m.phone)+'</span>':''}${m.snap?'<br><span class="muted">👻 '+esc(m.snap)+'</span>':''}</td><td>${esc(m.model||'—')}<div class="items">${itemsText(x.line_items)}</div></td><td>${dl}</td><td>${esc(appt)}</td><td class="tot">${euro(x.total_cents)}</td><td>${statusBadge(x.status)}</td><td><button class="del" onclick="delOrder(${x.id})" title="Supprimer cette commande">🗑</button></td></tr>`;}).join('')+`</tbody></table></div>`;}
function financeTable(o){return `<div class="panel tbl-scroll"><table><thead><tr><th>Date</th><th>Modèle / Articles</th><th>Encaissé</th><th>Coût pièces</th><th>Ton gain</th><th>Statut</th></tr></thead><tbody>`+
  o.map(x=>{const m=x.metadata||{};const cost=x._cost_cents,gain=x._gain_cents;
  return `<tr><td class="muted" style="white-space:nowrap">${fDT(x.created_at)}</td><td>${esc(m.model||'—')}<div class="items">${itemsText(x.line_items)}</div></td><td class="tot" style="color:var(--accent2)">${euro(x.total_cents)}</td><td class="tot ${cost==null?'muted':''}">${cost==null?'à confirmer':euro(cost)}</td><td class="tot" style="${gain!=null?'color:var(--ok)':''}">${gain==null?'—':euro(gain)}</td><td>${statusBadge(x.status)}</td></tr>`;}).join('')+`</tbody></table></div>`;}
function overCeilTable(a){return `<table><thead><tr><th>Produit</th><th>Modèle</th><th>Prix calculé</th><th>Plafond Apple</th></tr></thead><tbody>`+a.map(x=>`<tr><td>${esc(x.repairId)}</td><td>${esc(x.model)}</td><td class="tot up">${x.final} €</td><td>${x.ceiling} €</td></tr>`).join('')+`</tbody></table>`;}
function brokenTable(a){return `<table><thead><tr><th>Réparation</th><th>Modèle</th><th>Lien</th></tr></thead><tbody>`+a.map(x=>`<tr><td>${esc(x.repairId)}</td><td>${esc(x.model)}</td><td>${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener" style="color:var(--accent2)">ouvrir ↗</a>`:'<span class="muted">—</span>'}</td></tr>`).join('')+`</tbody></table>`;}
function gapsHtml(g){if(!g||!g.length)return `<div class="alert a-ok"><span>✓</span><span>Tous les modèles phares sont bien couverts.</span></div>`;
  return `<div class="panel">`+g.map(x=>`<div class="appt" style="align-items:flex-start"><div class="dt">${esc(x.model)}</div><div style="margin-left:auto;text-align:right">${x.missing.map(m=>`<span class="chip">${esc(m)}</span>`).join('')}</div></div>`).join('')+`</div>`;}
function coverageHtml(c){if(!c||!c.length)return '<div class="empty">—</div>';return `<table><thead><tr><th>Type de réparation</th><th>Modèles couverts</th></tr></thead><tbody>`+c.slice().sort((a,b)=>a.models-b.models).map(x=>`<tr><td>${esc(x.repairId)}</td><td>${x.models}${x.models<12?'<span class="soon">peu</span>':''}</td></tr>`).join('')+`</tbody></table>`;}
function historyTable(r){return `<table><thead><tr><th>Date</th><th>Produit</th><th>Modèle</th><th>Avant</th><th>Après</th></tr></thead><tbody>`+
  r.map(c=>{const arrow=c.kind==='up'?'<span class="up">▲</span>':c.kind==='down'?'<span class="down">▼</span>':c.kind==='oos'?'⛔':c.kind==='restock'?'✅':'•';
  const bef=c.oldOOS?'rupture':(c.oldFinal!=null?c.oldFinal+' €':'—');const aft=c.newOOS?'rupture':(c.newFinal!=null?c.newFinal+' €':'—');
  return `<tr><td class="muted" style="white-space:nowrap">${fDT(c.t)}</td><td>${esc(c.repairId)}</td><td>${esc(c.model)}</td><td class="muted">${bef}</td><td>${arrow} ${aft}</td></tr>`;}).join('')+`</tbody></table>`;}
function errorsTable(e){return `<table><thead><tr><th>Date</th><th>Client</th><th>Erreur</th><th>Total</th><th></th></tr></thead><tbody>`+e.map(x=>`<tr><td class="muted">${fDT(x.created_at)}</td><td>${esc(x.email||'—')}</td><td class="up">${esc(x.error)}</td><td class="tot">${euro(x.total)}</td><td><button class="del" onclick="delOrder(${x.id})" title="Supprimer">🗑</button></td></tr>`).join('')+`</tbody></table>`;}
function diag(label,ok,detail){return `<div class="appt"><div class="dt"><span class="dot ${ok?'ok':'dang'}" style="display:inline-block;margin-right:9px"></span>${esc(label)}</div><div class="who">${ok?'<span style="color:var(--ok)">OK</span>':'<span class="up">'+esc(detail||'problème')+'</span>'}</div></div>`;}

async function loadVisits(){$('#view').innerHTML=`<div class="sect-title">Fréquentation</div>${emptyBox('⏳','Chargement des statistiques…')}`;
  try{const r=await api('visits');VISITS=await r.json();}catch{VISITS={ready:false,reason:'réseau'};}if(TAB==='visitors')renderVisitors();}
function renderVisitors(){
  const v=$('#view');if(!VISITS){loadVisits();return;}
  if(!VISITS.ready){
    const sql=`create table if not exists public.visits (\n  id bigserial primary key,\n  ts timestamptz not null default now(),\n  day date not null, hour smallint not null,\n  session text, kind text default 'view',\n  path text, source text, ref_host text,\n  device text, country text, lang text\n);\ncreate index if not exists visits_ts_idx on public.visits(ts);\ncreate index if not exists visits_session_idx on public.visits(session);`;
    v.innerHTML=`<div class="sect-title">Activation requise</div>
      <div class="alert a-warn"><span>⚙️</span><span>Le suivi des visiteurs est <b>déjà installé sur le site</b> — il ne reste qu’à créer la table de stockage. Colle ceci dans <b>Supabase → SQL Editor → Run</b> :</span></div>
      <div class="panel panel-pad"><pre class="sql">${esc(sql)}</pre></div>`;return;
  }
  const d=VISITS;
  const liveBlock=(LIVE&&LIVE.ready)?`
    <div class="sect-title">En ce moment</div>
    <div class="panel panel-pad" style="margin-bottom:6px">
      <div style="display:flex;align-items:center;gap:11px"><span class="pulse" style="width:11px;height:11px;border-radius:50%;background:${LIVE.online?'var(--ok)':'var(--text3)'};display:inline-block"></span><span style="font-size:23px;font-weight:750">${LIVE.online}</span><span class="muted">personne(s) sur le site maintenant</span></div>
      ${(LIVE.visitors&&LIVE.visitors.length)?'<div style="margin-top:12px;border-top:1px solid var(--border);padding-top:10px">'+LIVE.visitors.map(x=>`<div style="display:flex;gap:10px;padding:6px 0;font-size:13px"><span style="flex:1;color:var(--text2)">${esc(x.path||'/')}</span><span class="muted">${esc(deviceFull(x.device,x.device_model))}${x.city?(' · '+esc(x.city)):(x.country?(' · '+esc(x.country)):'')}</span></div>`).join('')+'</div>':''}
    </div>`:'';
  v.innerHTML=liveBlock+`
    <div class="sect-title">Fréquentation (30 derniers jours)</div>
    <div class="kpis">
      ${kpi(d.today??0,'Visites aujourd’hui','ac')}
      ${kpi(d.total_30d??0,'Visites sur 30 j')}
      ${kpi(d.by_device.filter(x=>['iPhone','Android','iPod','mobile','Windows Phone'].includes(x.k)).reduce((s,x)=>s+x.v,0),'Sur mobile','ac')}
      ${kpi(d.by_country.length,'Pays différents')}
    </div>
    <div class="sect-title">Affluence par heure</div>
    <div class="panel panel-pad">${hourChart(d.by_hour)}</div>
    <div class="two">
      <div><div class="sect-title">Par source</div><div class="panel panel-pad">${d.by_source.length?bars(d.by_source.map(x=>({k:SRC_LABEL[x.k]||x.k,v:x.v}))):'<span class="muted">—</span>'}</div></div>
      <div><div class="sect-title">Par appareil</div><div class="panel panel-pad">${d.by_device.length?bars(d.by_device.map(x=>({k:DEV_LABEL[x.k]||x.k,v:x.v}))):'<span class="muted">—</span>'}</div></div>
    </div>
    <div class="two">
      <div><div class="sect-title">Par ville / région</div><div class="panel panel-pad">${(d.by_city&&d.by_city.length)?bars(d.by_city):'<span class="muted">En attente de visites réelles</span>'}</div></div>
      <div><div class="sect-title">Par pays</div><div class="panel panel-pad">${d.by_country.length?bars(d.by_country.map(x=>({k:'🌍 '+x.k,v:x.v}))):'<span class="muted">—</span>'}</div></div>
    </div>
    <div class="sect-title">Pages les plus vues</div>
    <div class="panel panel-pad">${d.by_path.length?bars(d.by_path):'<span class="muted">—</span>'}</div>`;
}
let LIVE=null,_livePoll=null,_autoPoll=null;
async function loadLive(){try{const r=await api('live');LIVE=await r.json();}catch{LIVE=null;}renderLiveBadge();if(TAB==='visitors'&&VISITS&&VISITS.ready)renderVisitors();}
async function loadVisitsSilent(){try{const r=await api('visits');VISITS=await r.json();}catch{}if(TAB==='home')render();}
function renderLiveBadge(){const el=$('#liveBadge'),t=$('#liveTxt');if(!el)return;
  if(LIVE&&LIVE.ready){const n=LIVE.online||0;el.className='live'+(n?'':' off');t.innerHTML=n?('<b>'+n+'</b> en ligne'):'0 en ligne';}
  else{el.className='live off';t.textContent='hors-ligne';}}
function startPolling(){clearInterval(_livePoll);clearInterval(_autoPoll);loadLive();loadVisitsSilent();
  _livePoll=setInterval(loadLive,10000);
  _autoPoll=setInterval(async()=>{try{const r=await api('data');if(r.ok){DATA=await r.json();renderHealth();renderNav();if(TAB!=='visitors'&&TAB!=='orders')render();}}catch{}},45000);}
function stopPolling(){clearInterval(_livePoll);clearInterval(_autoPoll);}
function tick(){const c=$('#clock');if(c)c.textContent=new Date().toLocaleString('fr-FR',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});}
setInterval(tick,1000);tick();tryLoad();
</script>
