name: Rafraîchir les prix Utopya

# ⛔ SCRAPING SUSPENDU le 2026-07-13 à la demande d'Utopya (support@utopya.fr,
#    Laingo) : « ne pas utiliser d'outils automatisés de récupération de
#    données (scraping) sur notre site, ce type d'usage entraîne la
#    désactivation DÉFINITIVE des comptes concernés ». Le compte a été
#    réactivé une fois — il ne le sera pas deux fois.
#
#    Ce workflow est aussi DÉSACTIVÉ côté GitHub (Actions → … → Disable),
#    donc il ne se déclenchera pas même si le cron ci-dessous était rétabli.
#    Le déclencheur périodique `schedule:` est retiré ci-dessous ; seul le
#    lancement 100 % MANUEL (workflow_dispatch) subsiste, et il faut D'ABORD
#    réactiver le workflow sur GitHub pour l'utiliser.
#
#    Le CODE du scraper (dossier scraper/) est CONSERVÉ intact pour une
#    éventuelle solution conforme future (API officielle, export manuel…).
#    NE PAS rétablir le `schedule:` sans accord écrit d'Utopya.

on:
  # schedule DÉSACTIVÉ (voir bandeau ci-dessus). Ne pas rétablir.
  # schedule:
  #   - cron: "47 4 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "login-test (vérif connexion seule) ou full (scrape complet)"
        required: true
        default: "login-test"
        type: choice
        options: [login-test, full]

# Un seul run à la fois ; on n'annule pas un run en cours.
concurrency:
  group: refresh-prices
  cancel-in-progress: false

permissions:
  contents: write   # pour committer prices.json
  issues: write     # pour ouvrir une issue d'alerte en cas d'échec

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 75   # 2 tentatives de ~25 min + marge
    defaults:
      run:
        working-directory: scraper
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install deps
        run: npm ci || npm install

      - name: Install Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: Run (login-test ou full)
        env:
          UTOPYA_EMAIL: ${{ secrets.UTOPYA_EMAIL }}
          UTOPYA_PASSWORD: ${{ secrets.UTOPYA_PASSWORD }}
          SCRAPE_CONCURRENCY: "2"
        run: |
          MODE="${{ github.event.inputs.mode || 'full' }}"
          echo "Mode = $MODE"
          ARGS=""; [ "$MODE" = "login-test" ] && ARGS="--login-only"
          # Reprise automatique : 2 tentatives (les échecs Cloudflare/latence
          # sont souvent transitoires). Un échec persistant = vrai problème
          # (ex : compte Utopya désactivé) → alerte via l'étape d'issue.
          for i in 1 2; do
            if node run.js $ARGS; then exit 0; fi
            if [ "$i" = "1" ]; then echo "Tentative 1 échouée — nouvelle tentative dans 3 min…"; sleep 180; fi
          done
          exit 1

      - name: Valider prices.json (garde-fou anti-publication-cassée)
        if: ${{ github.event.inputs.mode != 'login-test' }}
        run: |
          node -e '
            const fs=require("fs");
            const d=JSON.parse(fs.readFileSync("prices.json","utf8"));
            const p=d.prices||{};
            let act=0,zero=0;
            for(const c of Object.values(p)){if(c&&typeof c==="object"){for(const v of Object.values(c)){if(v&&typeof v==="object"){const f=v.final;if(typeof f==="number"&&f>0)act++;else zero++;}}}}
            console.log("generatedAt="+d.generatedAt+" | prix actifs="+act+" | sans prix="+zero);
            if(act < 150){ console.error("ABANDON: trop peu de prix actifs ("+act+") — on ne publie pas un scrape suspect."); process.exit(1); }
          '

      - name: Commit & push prices.json (si changé)
        if: ${{ github.event.inputs.mode != 'login-test' }}
        run: |
          cd "$GITHUB_WORKSPACE"
          if git diff --quiet -- scraper/prices.json scraper/price-history.json; then
            echo "Aucun changement de prix — rien à committer."
          else
            git config user.name "safix-prices-bot"
            git config user.email "actions@users.noreply.github.com"
            git add scraper/prices.json scraper/price-history.json
            git commit -m "Auto: rafraîchissement prix Utopya ($(date -u +%Y-%m-%d))"
            git push
            echo "prices.json + historique publiés → Vercel va auto-déployer."
          fi

      - name: Alerte en cas d'échec (issue GitHub, sans doublon)
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$GITHUB_WORKSPACE"
          TITLE="⚠️ Rafraîchissement des prix en échec"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number' || true)
          BODY="Le run [\#${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) a échoué le $(date -u '+%Y-%m-%d %H:%M UTC') après 2 tentatives.

          Causes fréquentes : compte Utopya désactivé (« Votre compte n'est pas actif » → contacter le support Utopya), identifiants changés (secrets UTOPYA_EMAIL / UTOPYA_PASSWORD), ou blocage Cloudflare persistant.

          ⚠️ Tant que ce n'est pas réglé, les prix du site restent figés au dernier scrape réussi."
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
