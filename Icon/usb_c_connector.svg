<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 130" width="100" height="130" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
  <!-- 1. Tip USB-C (pill ovale réversible — signature USB-C) -->
  <rect x="22" y="15" width="56" height="30" rx="15"/>
  <!-- 2. Slot intérieur (petite pill stroke seule, comme dans l'image source) -->
  <rect x="32" y="22" width="36" height="16" rx="8"/>
  <!-- 3. Corps du connecteur (sans câble, sans épaulement — fidèle à l'image source) -->
  <rect x="22" y="50" width="56" height="70" rx="9"/>
</svg>
