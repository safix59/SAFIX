  <rect x="34" y="22" width="32" height="28" rx="2.5"/>
  <line x1="38" y1="28" x2="38" y2="44"/>
  <line x1="42" y1="28" x2="42" y2="44"/>
  <line x1="46" y1="28" x2="46" y2="44"/>
  <line x1="50" y1="28" x2="50" y2="44"/>
  <line x1="54" y1="28" x2="54" y2="44"/>
  <line x1="58" y1="28" x2="58" y2="44"/>
  <line x1="62" y1="28" x2="62" y2="44"/>
  <!-- 2. Épaulement (légèrement plus large que le tip) -->
  <rect x="28" y="50" width="44" height="6" rx="2"/>
  <!-- 3. Corps du connecteur (cable head) -->
  <rect x="22" y="58" width="56" height="106" rx="10"/>
